services:
  netbox:
    build:
      context: .
      dockerfile: Dockerfile-plugins
      args:
        FROM_TAG: v4.4-3
    image: bboerni2/netbox:v4.4-3-plugins
    ports:
      - "8000:8080"
    restart: unless-stopped

  netbox-worker:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis-cache:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
