
services:
  netbox:
    # WICHTIG: eigenes Image bauen
    build:
      context: .
      dockerfile: Dockerfile-plugins
    # lokaler Name statt Upstream-Tag
    image: netbox-plugins:local
    pull_policy: never
    ports:
      - "8000:8080"
    restart: unless-stopped
    healthcheck:
      # längere Werte für den local Build
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 10
    environment:
      DB_WAIT_TIMEOUT: "180"
      DB_WAIT_DEBUG: "1"

  netbox-worker:
    restart: unless-stopped
    image: netbox-plugins:local
    pull_policy: never
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      netbox:
        condition: service_started

  netbox-housekeeping:
    restart: unless-stopped
    image: netbox-plugins:local
    pull_policy: never
    environment:
      DB_WAIT_TIMEOUT: "180"
      DB_WAIT_DEBUG: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      netbox:
        condition: service_started

  postgres:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis-cache:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
