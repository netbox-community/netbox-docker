
services:
  netbox:
    # WICHTIG: eigenes Image bauen
    build:
      context: .
      dockerfile: Dockerfile-plugins
    # lokaler Name statt Upstream-Tag:
    image: netbox-plugins:local
    pull_policy: never
    ports:
      - "8000:8080"
    restart: unless-stopped

  netbox-worker:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis-cache:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
