
x-netbox-image: &netbox_image netboxplugins:local

services:
  netbox:
    # WICHTIG: eigenes Image bauen
    build:
      context: .
      dockerfile: Dockerfile-plugins
    # optionaler lokaler Name statt Upstream-Tag:
    image: netbox-plugins:local
    # Plugins in NetBox aktivieren
    environment:
      PLUGINS: "netbox_topology_views,netbox_lifecycle,netbox_plugin_prometheus_sd,netbox_qrcode"
    ports:
      - "8000:8080"
    restart: unless-stopped

  netbox-worker:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis-cache:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
