
services:
  netbox:
    # WICHTIG: eigenes Image bauen
    build:
      context: .
      dockerfile: Dockerfile-withplugins
    # lokaler Name statt Upstream-Tag
    image: netbox-withplugins:local
    pull_policy: never
    ports:
      - "8000:8080"
    restart: unless-stopped
    healthcheck:
      # längere Werte für den local Build
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 10
    environment:
      DB_WAIT_TIMEOUT: "180"
      DB_WAIT_DEBUG: "1"
      NETBOX_TO_DIODE_CLIENT_SECRET: ${NETBOX_TO_DIODE_CLIENT_SECRET}
      DIODE_GRPC_TARGET: ${DIODE_GRPC_TARGET}
      DIODE_USERNAME: ${DIODE_USERNAME}

  netbox-worker:
    restart: unless-stopped
    image: netbox-withplugins:local
    pull_policy: never
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      netbox:
        condition: service_started

  netbox-housekeeping:
    restart: unless-stopped
    image: netbox-withplugins:local
    pull_policy: never
    environment:
      DB_WAIT_TIMEOUT: "180"
      DB_WAIT_DEBUG: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      netbox:
        condition: service_started

  postgres:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis-cache:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # docker-compose.override.yml – Zusatzservice
  proxbox-api:
    image: emersonfelipesp/proxbox-api:latest
    environment:
      # NetBox wird vom Backend via API beschrieben:
      NETBOX_URL: http://netbox:8080
      NETBOX_TOKEN: ${NETBOX_API_TOKEN}
    depends_on:
      netbox:
        condition: service_started
    restart: unless-stopped

networks:
  diode_net:
    external: true
