version: "3.9"

x-netbox-image: &netbox_image netboxplugins:local

services:
  netbox:
    build:
      context: .
      dockerfile: Dockerfile-plugins
      args:
        FROM_TAG: v4.4-3
    image: *netbox_image
    pull_policy: never
    ports:
      - "8000:8080"
    restart: unless-stopped

  worker:
    image: *netbox_image
    pull_policy: never
    restart: unless-stopped

  housekeeping:
    image: *netbox_image
    pull_policy: never
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py housekeeping
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
